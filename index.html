<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Core Stylesheet -->
    <link rel="stylesheet" href="terminal.css-main/index.css" />
    <!-- Optional. Only for toast, FAQ component -->
    <script src="terminal.css-main/index.js"></script>
    <link rel="stylesheet" href="terminal.css-main/themes/ayu-dark.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            padding-left: 10px;
            padding-right: 10px;

            /* 1. Default for Mobile: Stack items vertically */
            flex-direction: column;
            gap: 10px;
            min-height: 100vh;
            margin: 0;
        }

        /* 2. Responsive adjustment for Tablets & Desktops */
        @media (min-width: 768px) {
            body {
                /* Flips to side-by-side layout when the screen is wide enough */
                flex-direction: row;
            }
        }

        .terminal {
            margin-top: 10px;
            margin-bottom: 10px;
            padding-top: 4px;
            padding-left: 4px;
            box-sizing: border-box;
            height: calc(100vh - 40px);
            min-height: 220px;
            display: flex;
            flex-direction: column;
            padding-bottom: 4px;
            border-color: #8be9fd;
            border-style: solid;
            border-width: 2px;
            border-radius: 1cap;
            flex: 1;
        }

        .terminal-output {
            margin-bottom: 0 !important;
            padding-top: 0px !important;
            padding-bottom: 0px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            padding-left: 4px;
        }

        .terminal-input-row {
            padding: 4px 2px 4px 8px;
            margin-bottom: 3px;
            flex-shrink: 0;
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            gap: 0;
            position: relative;
            overflow: hidden;
        }

        .terminal-input-row::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: #4dd7ff;
            box-shadow: 0 0 8px rgba(77, 215, 255, 0.9);
        }

        .prompt-prefix {
            margin-right: 8px;
            color: #5ef0bd;
            font-weight: 700;
            font-size: 1.15rem;
            line-height: 1;
        }

        .terminal-input-row .prompt-prefix {
            color: #5ef0bd;
            font-weight: 700;
            margin-right: 8px;
            font-size: 1.15rem;
            line-height: 1;
        }

        .terminal-input-row .has-text-primary {
            color: #7ee7ff;
            font-weight: 500;
            font-size: 1rem;
            line-height: 1.4;
            white-space: nowrap;
        }

        .terminal-command-input {
            background: transparent;
            border: none;
            outline: none;
            color: #dffcff;
            font-size: 1rem;
            line-height: 1.4;
            padding: 0 0 0 2px;
            width: 100%;
            min-width: 0;
            caret-color: #8be9fd;
            caret-shape: block;
        }

        .terminal-command-input:focus {
            outline: none;
        }

        #terminal_sidebar {
            max-width: 25%;
        }
        .input {
            font-size: 1rem;
            padding: 0px;
        }

        .subtitle {
            font-size: 1.1rem !important;
            line-height: 1.5;
        }
    </style>
</head>

<body class="body">
    <div id="terminal_sidebar" class="terminal">
        <div class="terminal-output"></div>
        <div class="control terminal-input-row">
            <span class="prompt-prefix">→</span>
            <span class="has-text-primary">atharvak@dev$</span>
            <input type="text" class="terminal-command-input" />
        </div>
    </div>
    <div id="terminal" class="terminal">
        <div class="terminal-output"></div>
        <div class="control terminal-input-row">
            <span class="prompt-prefix">→</span>
            <span class="has-text-primary">atharvak@dev$</span>
            <input type="text" class="terminal-command-input" />
        </div>
    </div>


    <script>


        const commandHandlers = {
            "whoami": () => "Atharva Dixit",
            "hostname -i": () => "Solapur, Maharashtra, India"
        };

        function createTextOutput(text, isSuccess) {
            const output = document.createElement("p");
            output.className = `subtitle is-6 mb-3 ${isSuccess ? "has-text-success" : "has-text-danger"}`;
            output.style.margin = "0 0px";
            output.textContent = text;
            return output;
        }

        function renderCommandResult(container, result, isSuccess) {
            if (result == null) return;

            const outputs = Array.isArray(result) ? result : [result];
            outputs.forEach((output) => {
                if (typeof output === "string") {
                    container.appendChild(createTextOutput(output, isSuccess));
                } else if (output instanceof Node) {
                    container.appendChild(output);
                }
            });
        }

        function runCommand(terminal, command) {
            const commandOutput = document.createElement("div");
            const arrow = document.createElement("span");
            arrow.className = "prompt-prefix";
            arrow.textContent = "→";

            const enteredCommand = document.createElement("span");
            enteredCommand.className = "input";
            enteredCommand.textContent = command;

            commandOutput.appendChild(arrow);
            commandOutput.appendChild(enteredCommand);

            const normalizedCommand = command.trim().toLowerCase();
            const isRegistered = Object.hasOwn(commandHandlers, normalizedCommand);
            const isSuccess = isRegistered;
            const result = isSuccess
                ? commandHandlers[normalizedCommand](command)
                : `Command not found: ${command}`;
            renderCommandResult(commandOutput, result, isSuccess);
            const terminalOutput = terminal.querySelector(".terminal-output");
            terminalOutput.appendChild(commandOutput);
            terminalOutput.scrollTop = terminalOutput.scrollHeight;
        }

        document.querySelectorAll(".terminal").forEach((terminal) => {
            terminal.addEventListener("keydown", (event) => {
                if (!event.target.matches(".terminal-command-input") || event.key !== "Enter") return;
                event.preventDefault();
                const command = event.target.value;
                if (!command.trim()) return;

                runCommand(terminal, command);
                event.target.value = "";
            });
        });
    </script>
</body>

</html>
